name: Version Packages

on:
  push:
    branches: [main]

concurrency:
  group: version-packages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create Version Packages PR or tag product release
        id: changesets
        uses: changesets/action@v1
        with:
          title: Version Packages
          commit: Version Packages
          version: pnpm version-packages
          publish: pnpm tag-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Summary
        run: |
          echo "published=${{ steps.changesets.outputs.published }}" >> "$GITHUB_STEP_SUMMARY"
          echo "hasChangesets=${{ steps.changesets.outputs.hasChangesets }}" >> "$GITHUB_STEP_SUMMARY"
