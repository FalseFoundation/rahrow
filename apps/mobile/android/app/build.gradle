apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace = "foundation.falsefoundation.rahrow"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "foundation.false.rahrow"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    // extractNativeLibs so isolated Xray InMemoryDexClassLoader can resolve libgojni.so
    // via nativeLibraryDir (APK-embedded natives are invisible to that loader).
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

def rahrowRuntimeAars = [
    file('libs/libXray.aar'),
    file('libs/libbox.aar'),
    file('libs/hev-socks5-tunnel.aar'),
]
def rahrowExtractedRuntimeAars = [
    file('libs/libXray.aar'),
    file('libs/hev-socks5-tunnel.aar'),
]

def rahrowNativeLibraries = layout.buildDirectory.dir('generated/rahrowNativeRuntimes')
def rahrowXrayRuntimeJar = layout.buildDirectory.file('generated/rahrowXrayApi/rahrow-libxray.jar')
def rahrowXrayAssetsDir = layout.buildDirectory.dir('generated/rahrowXrayAssets')
def extractRahrowNativeLibraries = tasks.register('extractRahrowNativeLibraries', Sync) {
    from(rahrowExtractedRuntimeAars.collect { zipTree(it) }) {
        include 'jni/**'
        eachFile { details ->
            details.path = details.path.replaceFirst('^jni/', '')
        }
        includeEmptyDirs = false
    }
    into rahrowNativeLibraries
}

// libXray and libbox both ship gomobile go.Seq (loadLibrary gojni vs box). Keep
// libbox's Seq on the app classpath; ship a d8-compiled libXray dex (with its own
// Seq) as an asset loaded via InMemoryDexClassLoader in the :vpn_xray process only.
def packageRahrowXrayApi = tasks.register('packageRahrowXrayApi') {
	def xrayAar = file('libs/libXray.aar')
	def outJar = rahrowXrayRuntimeJar.get().asFile
	def assetsDir = rahrowXrayAssetsDir.get().asFile
	def buildToolsDir = file("${System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT') ?: "${System.getProperty('user.home')}/Android/Sdk"}/build-tools")
	inputs.file(xrayAar)
	outputs.file(outJar)
	outputs.dir(assetsDir)
	doLast {
		def staging = layout.buildDirectory.dir('tmp/rahrowXrayApi').get().asFile
		delete staging
		staging.mkdirs()
		copy {
			from(zipTree(xrayAar))
			include 'classes.jar'
			into staging
		}
		def classesDir = new File(staging, 'classes')
		copy {
			from(zipTree(new File(staging, 'classes.jar')))
			exclude 'META-INF/**'
			into classesDir
		}
		outJar.parentFile.mkdirs()
		ant.jar(destfile: outJar, basedir: classesDir)

		def d8 = buildToolsDir.listFiles()?.findAll { it.isDirectory() }?.toSorted()?.reverse()?.collect { new File(it, 'd8') }?.find { it.isFile() }
		if (d8 == null) {
			throw new GradleException("Android build-tools d8 not found under ${buildToolsDir}")
		}
		def d8Out = new File(staging, 'd8-out')
		d8Out.mkdirs()
		exec {
			commandLine d8.absolutePath, '--output', d8Out.absolutePath, outJar.absolutePath
		}
		def dexFile = new File(d8Out, 'classes.dex')
		if (!dexFile.isFile()) {
			throw new GradleException("d8 did not produce classes.dex for libXray")
		}
		delete assetsDir
		assetsDir.mkdirs()
		copy {
			from dexFile
			into assetsDir
			rename { 'rahrow-libxray.dex' }
		}
	}
}

android.sourceSets.main.jniLibs.srcDir(rahrowNativeLibraries)
android.sourceSets.main.assets.srcDir(rahrowXrayAssetsDir)

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation files('libs/libbox.aar')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation 'com.google.zxing:core:3.5.3'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

tasks.named('preBuild').configure {
    dependsOn extractRahrowNativeLibraries, packageRahrowXrayApi
    doFirst {
        def missing = rahrowRuntimeAars.findAll { !it.isFile() }
        if (!missing.isEmpty()) {
            throw new GradleException(
                "Pinned RahRow Android runtimes are missing: ${missing*.name.join(', ')}. " +
                "Stage the checksummed AARs before building; runtime downloads and PATH fallbacks are forbidden."
            )
        }
    }
}

apply from: 'capacitor.build.gradle'

if (providers.gradleProperty('rahrowExcludeAdmob').isPresent()) {
    configurations.configureEach { configuration ->
        configuration.dependencies.removeAll { dependency ->
            dependency instanceof ProjectDependency &&
                dependency.dependencyProject.path == ':capacitor-community-admob'
        }
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
