packages:
  - apps/**
  - packages/**
allowBuilds:
  argon2: true
  esbuild: true
  sharp: true
minimumReleaseAgeExclude:
  - uuid@11.1.1
  - sharp@0.35.5
overrides:
  "tar@<7.5.21": "7.5.22"
  "uuid@<11.1.1": "11.1.1"
  "sharp@<0.35.4": "0.35.5"
auditConfig:
  ignoreGhsas:
    # braces <=3.0.3 has no published release. patches/braces@3.0.3.patch
    # rejects nesting past 100, which is the GHSA-vfj7-8cjw-p6xm failure.
    - GHSA-vfj7-8cjw-p6xm
patchedDependencies:
  braces@3.0.3: patches/braces@3.0.3.patch
